<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>X 粉丝数 · 模拟数据测试</title>
<style>
  body { margin: 0; background: #080c10; color: #e7e9ea; font: 15px/1.5 Arial, sans-serif; }
  main { width: 620px; margin: 48px auto; border: 1px solid #2b3036; border-radius: 18px; overflow: hidden; }
  header { padding: 24px; border-bottom: 1px solid #2b3036; }
  h1 { margin: 0 0 8px; font-size: 24px; }
  p { color: #858e98; margin: 0; }
  .row { display: flex; gap: 14px; padding: 22px; border-bottom: 1px solid #2b3036; }
  .avatar { border-radius: 50%; width: 42px; height: 42px; display: grid; place-items: center; background: #203445; color: #8dc7ec; }
  a { color: inherit; text-decoration: none; }
  .name { font-weight: 700; }
  .handle { color: #717f8c; }
  button { margin-left: auto; border: 0; border-radius: 20px; padding: 6px 18px; background: #eff3f4; font-weight: 700; }
  .section { color: #85909c; padding: 12px 24px; font-size: 12px; letter-spacing: 1px; }
</style>
<script>
window.__INITIAL_STATE__ = { users: [{ core: { screen_name: 'Alice' }, relationship_counts: { followers: 12345, following: 20 } }] };
</script>
<main>
  <header><h1>X 粉丝数</h1><p>本地模拟页面 · 用于验证扩展，不是原帖截图</p></header>
  <div class="section">用户列表</div>
  <div class="row" data-testid="UserCell" id="alice">
    <div class="avatar">A</div><div><a class="name" href="/Alice"><span>Alice · AI 创作者</span></a><br>
    <a class="handle" href="/Alice"><span>@Alice</span></a><p>学习与分享技术</p></div><button>关注</button>
  </div>
  <div class="row" data-testid="UserCell" id="bob">
    <div class="avatar">B</div><div><a class="name" href="/Bob"><span>Bob · 新用户</span></a><br>
    <a class="handle" href="/Bob"><span>@Bob</span></a></div><button>关注</button>
  </div>
  <div class="section">信息流 / 引用推文</div>
  <article class="row" data-testid="tweet"><div class="avatar">C</div><div>
    <div data-testid="User-Name" id="carol"><a href="/Carol"><div style="display:flex;flex-direction:row;align-items:center"><span class="name">Carol</span><span aria-label="Verified account">✓</span></div></a> <a class="handle" href="/Carol"><span>@Carol</span></a></div>
    <p>粉丝数直接来自页面响应，鼠标悬停可查看完整数字。</p>
    <div data-testid="User-Name" id="quote"><a href="/Alice"><span class="name">Alice</span></a> <a class="handle" href="/Alice"><span>@Alice</span></a></div>
  </div></article>
  <div class="row" data-testid="UserCell" id="unknown"><a href="/Unknown"><span>@Unknown</span></a><p>响应中没有粉丝数字段时不显示</p></div>
</main>
</html>
